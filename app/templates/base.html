<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AutoPR Reviewer{% endblock %}</title>
    <link rel="icon" type="image/png" href="/static/FullLogo.png">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #0d1117;
            color: #e6edf3;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { color: #58a6ff; text-decoration: none; }
        a:hover { text-decoration: underline; }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            flex: 1;
        }

        nav {
            background: #161b22;
            border-bottom: 1px solid #30363d;
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        /* Logo is now a link */
        nav .logo {
            font-weight: 700;
            font-size: 1.1rem;
            color: #e6edf3;
            text-decoration: none;
            white-space: nowrap;
        }
        nav .logo:hover { text-decoration: none; color: #fff; }
        nav a { color: #8b949e; font-size: 0.9rem; }
        nav a:hover { color: #e6edf3; text-decoration: none; }

        .btn {
            display: inline-block;
            padding: 0.65rem 1.5rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.95rem;
            text-decoration: none;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.15s;
        }
        .btn-primary { background: #238636; color: #fff; border-color: #2ea043; }
        .btn-primary:hover { background: #2ea043; text-decoration: none; }
        .btn-secondary { background: #21262d; color: #e6edf3; border-color: #30363d; }
        .btn-secondary:hover { background: #30363d; text-decoration: none; }
        .btn-pro { background: #8957e5; color: #fff; border-color: #a371f7; }
        .btn-pro:hover { background: #a371f7; text-decoration: none; }
        .btn-danger { background: #da3633; color: #fff; border-color: #f85149; }
        .btn-danger:hover { background: #f85149; text-decoration: none; }

        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1rem;
        }

        .badge {
            display: inline-block;
            padding: 0.2rem 0.6rem;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
        }
        .badge-basic { background: #21262d; color: #8b949e; }
        .badge-pro { background: #8957e5; color: #fff; }

        footer {
            text-align: center;
            padding: 1.25rem 1.5rem;
            color: #484f58;
            font-size: 0.85rem;
            border-top: 1px solid #30363d;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1.5rem;
            flex-wrap: wrap;
        }
        footer a { color: #484f58; }
        footer a:hover { color: #8b949e; text-decoration: none; }

        /* Status dot */
        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            color: #484f58;
            text-decoration: none;
        }
        .status-dot::before {
            content: '';
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #3fb950;
            box-shadow: 0 0 4px #3fb950;
        }
        .status-dot:hover { color: #8b949e; text-decoration: none; }

        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    <nav>
        <a href="/" class="logo">🤖 AutoPR Reviewer</a>
        <a href="/">Home</a>
        {% block nav_extra %}{% endblock %}
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <span>AutoPR Reviewer &mdash; AI-powered GitHub PR reviews</span>
        <a href="https://stats.uptimerobot.com/f3AQQEDMx6" class="status-dot" target="_blank" rel="noopener">
            All systems operational
        </a>
    </footer>
</body>
</html>
